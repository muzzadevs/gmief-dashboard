services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["mariadbd", "--port=${MARIADB_PORT:-3307}"]
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gmief}
      MARIADB_USER: ${MARIADB_USER:-gmief_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-gmief_local_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-gmief_root_local}
    ports:
      - "${MARIADB_PORT:-3307}:${MARIADB_PORT:-3307}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MARIADB_USER:-gmief_app}:${MARIADB_PASSWORD:-gmief_local_password}@db:${MARIADB_PORT:-3307}/${MARIADB_DATABASE:-gmief}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configura ENCRYPTION_KEY en .env}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mariadb_data:
